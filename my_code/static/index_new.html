<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rural Healthcare System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-dark: #1e293b;
            --input-dark: #334155;
            --text-light: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #0ea5e9;
            --accent-hover: #0284c7;
            --success: #22c55e;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            color: var(--text-light);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            border: 1px solid var(--input-dark);
            border-radius: 16px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        header h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 2rem;
            color: #f8fafc;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
        }

        /* Sections */
        section {
            background: var(--panel-dark);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid var(--input-dark);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            color: #f8fafc;
            font-family: 'Poppins', sans-serif;
            margin-bottom: 20px;
            font-size: 1.3rem;
            border-bottom: 1px solid var(--input-dark);
            padding-bottom: 10px;
        }

        h3 {
            color: var(--accent);
            margin: 15px 0 10px;
            font-size: 1.1rem;
        }

        /* Form Grid */
        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            background: var(--bg-dark);
            border: 2px solid var(--input-dark);
            border-radius: 10px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 100px;
        }

        /* Large File Upload Boxes */
        .upload-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .file-upload-box {
            background: var(--bg-dark);
            border: 2px dashed var(--input-dark);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 150px;
        }

        .file-upload-box:hover {
            border-color: var(--accent);
            background: rgba(14, 165, 233, 0.05);
        }

        .upload-box-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #f8fafc;
            margin-bottom: 8px;
        }

        .upload-box-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Button */
        .process-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .process-btn:hover {
            transform: translateY(-2px);
        }

        .process-btn:disabled {
            background: var(--input-dark);
            cursor: not-allowed;
            transform: none;
        }

        /* Logs Accordion */
        .accordion {
            background-color: var(--input-dark);
            color: #f8fafc;
            cursor: pointer;
            padding: 15px;
            width: 100%;
            border: none;
            text-align: left;
            outline: none;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .accordion:after {
            content: '\002B';
            color: var(--text-muted);
            font-weight: bold;
            font-size: 1.2rem;
        }

        .accordion.active:after {
            content: "\2212";
        }

        .log-panel {
            padding: 0 15px;
            background-color: #000;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.2s ease-out;
            border-radius: 0 0 8px 8px;
            font-family: 'Consolas', monospace;
            font-size: 0.9rem;
        }

        .log-content {
            padding: 15px 0;
            color: #a3e635;
            /* Terminal green */
        }

        .log-entry {
            margin-bottom: 4px;
        }

        /* RESULTS SECTION STYLES */
        .results-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .result-block {
            background: var(--bg-dark);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--input-dark);
        }

        .json-dump {
            background: #000;
            color: #22c55e;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 300px;
            overflow: auto;
            font-size: 0.85rem;
        }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .media-item img {
            width: 100%;
            border-radius: 8px;
            border: 1px solid var(--input-dark);
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th,
        td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid var(--input-dark);
            color: #e2e8f0;
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
        }

        .error-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            white-space: pre-wrap;
            font-family: monospace;
        }

        /* Chits/Cards for similar cases */
        .case-card {
            background: #1e293b;
            border-left: 4px solid var(--accent);
            padding: 15px;
            margin-bottom: 10px;
        }

        /* Chat Interface */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 500px;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            border: 1px solid var(--input-dark);
            background: var(--bg-dark);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
        }

        .user-message {
            align-self: flex-end;
            background: var(--accent);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .bot-message {
            align-self: flex-start;
            background: var(--input-dark);
            color: #f8fafc;
            border-bottom-left-radius: 2px;
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            border: 2px solid var(--input-dark);
            background: var(--bg-dark);
            color: white;
        }

        .send-btn {
            padding: 0 25px;
            background: var(--accent);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        /* Hidden inputs */
        input[type="file"] {
            display: none;
        }

        .file-list {
            margin-top: 5px;
            color: #4ade80;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Rural Healthcare System</h1>
            <p>Agentic Patient Analysis & Assistant</p>
        </header>

        <!-- Upload Section -->
        <section>
            <h2>Patient Data Entry</h2>
            <form id="ingestionForm">
                <div class="input-grid">
                    <div class="form-group">
                        <label>Patient ID</label>
                        <input type="text" id="patientHash" class="form-control" name="patient_hash" required
                            placeholder="e.g. PAT-2026-001">
                    </div>
                    <div class="form-group">
                        <label>Device ID</label>
                        <input type="text" id="deviceId" class="form-control" name="device_id" value="web_device_01">
                    </div>
                    <div class="form-group full-width">
                        <label>Clinical Notes</label>
                        <textarea id="textNotes" class="form-control" name="text_notes"
                            placeholder="Describe symptoms, history..."></textarea>
                    </div>
                </div>

                <!-- Large Upload Boxes -->
                <div class="upload-grid">
                    <!-- Audio -->
                    <div class="file-upload-box" onclick="document.getElementById('audioFile').click()">
                        <div class="upload-box-title">Voice Recording</div>
                        <div class="upload-box-desc">Click to upload audio (MP3/WAV)</div>
                        <div id="audioList" class="file-list"></div>
                        <input type="file" id="audioFile" name="audio" accept="audio/*">
                    </div>

                    <!-- Images -->
                    <div class="file-upload-box" onclick="document.getElementById('imageFiles').click()">
                        <div class="upload-box-title">Patient Photos</div>
                        <div class="upload-box-desc">Click to upload images</div>
                        <div id="imageList" class="file-list"></div>
                        <input type="file" id="imageFiles" name="images" accept="image/*" multiple>
                    </div>

                    <!-- Documents -->
                    <div class="file-upload-box" onclick="document.getElementById('docFiles').click()">
                        <div class="upload-box-title">Medical PDFs</div>
                        <div class="upload-box-desc">Click to upload reports</div>
                        <div id="docList" class="file-list"></div>
                        <input type="file" id="docFiles" name="documents" accept=".pdf,.txt,.doc,.docx" multiple>
                    </div>
                </div>

                <button type="submit" class="process-btn" id="submitBtn">Process Patient Data</button>
            </form>

            <div id="errorDisplay" class="error-box" style="display: none;"></div>
        </section>

        <!-- Logs Section (Collapsible) -->
        <section>
            <button class="accordion" id="accordionBtn">Processing Logs</button>
            <div class="log-panel">
                <div class="log-content" id="logContent">
                    <div class="log-entry">Waiting for input...</div>
                </div>
            </div>
        </section>

        <!-- FULL RESULTS RENDER -->
        <section id="resultsSection" style="display: none;">
            <h2>Analysis Results</h2>
            <div class="results-container" id="resultsContent">
                <!-- Data will be injected here -->
            </div>

            <button class="accordion" style="margin-top: 20px;">Raw JSON Output</button>
            <div class="log-panel">
                <div id="rawJsonContent" class="json-dump"></div>
            </div>
        </section>

        <!-- Chat Section -->
        <section id="chatSection" style="display: none;">
            <h2>AI Assistant Checkup</h2>
            <div class="chat-container">
                <div class="chat-history" id="chatHistory">
                    <!-- Messages will appear here -->
                </div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" class="chat-input"
                        placeholder="Ask about this patient's analysis...">
                    <button class="send-btn" onclick="sendChat()">Send</button>
                </div>
            </div>
        </section>
    </div>

    <script>
        let currentInteractionId = null;

        // Accordion Logic
        const accordions = document.querySelectorAll('.accordion');
        accordions.forEach(acc => {
            acc.addEventListener('click', function () {
                this.classList.toggle('active');
                const panel = this.nextElementSibling;
                if (panel.style.maxHeight) {
                    panel.style.maxHeight = null;
                } else {
                    panel.style.maxHeight = panel.scrollHeight + "px";
                }
            });
        });

        // File List Update
        function updateList(input, displayId) {
            const list = document.getElementById(displayId);
            if (input.files.length > 0) {
                const names = Array.from(input.files).map(f => f.name).join(', ');
                list.textContent = "Selected: " + names;
            } else {
                list.textContent = "";
            }
        }
        document.getElementById('audioFile').onchange = function () { updateList(this, 'audioList'); };
        document.getElementById('imageFiles').onchange = function () { updateList(this, 'imageList'); };
        document.getElementById('docFiles').onchange = function () { updateList(this, 'docList'); };

        // Process Form
        document.getElementById('ingestionForm').onsubmit = async function (e) {
            e.preventDefault();

            const btn = document.getElementById('submitBtn');
            const logContent = document.getElementById('logContent');
            const chatSection = document.getElementById('chatSection');
            const resultsSection = document.getElementById('resultsSection');
            const errorDisplay = document.getElementById('errorDisplay');
            const logPanel = logContent.parentElement;

            btn.disabled = true;
            btn.textContent = "Processing...";
            logContent.innerHTML = "";
            chatSection.style.display = "none";
            resultsSection.style.display = "none";
            errorDisplay.style.display = "none";

            // Auto-open logs
            if (!document.getElementById('accordionBtn').classList.contains('active')) {
                document.getElementById('accordionBtn').click();
            }

            const formData = new FormData(this);
            const appendLog = (msg) => {
                const div = document.createElement('div');
                div.className = 'log-entry';
                // msg = msg.replace(/\[.*?\]/g, '').trim();
                if (!msg) return;
                div.textContent = msg;
                logContent.appendChild(div);
                logPanel.style.maxHeight = logPanel.scrollHeight + "px";
                logPanel.scrollTop = logPanel.scrollHeight;
            };

            appendLog("Starting processing...");

            try {
                const res = await fetch('/api/process', {
                    method: 'POST',
                    body: formData
                });

                const data = await res.json();

                if (data.logs) {
                    data.logs.forEach(l => appendLog(l));
                }

                if (res.ok && data.success) {
                    currentInteractionId = data.interaction_id;
                    btn.textContent = "Processing Complete";
                    appendLog("DONE - Interaction ID: " + currentInteractionId);

                    // FETCH COMPLETE OUTPUT
                    await fetchAndRenderResults(currentInteractionId);

                    chatSection.style.display = "block";
                    const botMsg = `Analysis complete. I can answer questions about the diagnosis, similarity, or recommendations.`;
                    addChatMessage(botMsg, false);
                } else {
                    throw new Error(data.detail?.error || "Processing failed");
                }
            } catch (err) {
                appendLog("Error: " + err.message);
                btn.disabled = false;
                btn.textContent = "Retry Processing";

                errorDisplay.textContent = "CRITICAL ERROR:\n" + err.stack;
                errorDisplay.style.display = "block";
            }
        };

        // FETCH AND RENDER ALL OUTPUTS
        async function fetchAndRenderResults(interactionId) {
            const res = await fetch(`/api/final_output/${interactionId}`);
            if (!res.ok) throw new Error("Failed to fetch final output");
            const data = await res.json();

            // Render Raw JSON
            document.getElementById('rawJsonContent').textContent = JSON.stringify(data, null, 2);

            const content = document.getElementById('resultsContent');
            content.innerHTML = ""; // Clear

            // 1. Files section removed per user request

            // 2. Patient Data

            // 2. Patient Data
            if (data.patient_data) {
                content.innerHTML += `
                <div class="result-block">
                    <h3>Patient Demographics & Vitals</h3>
                    <div class="table-responsive">
                    <table>
                        ${Object.entries(data.patient_data).map(([k, v]) => `<tr><th>${k}</th><td>${typeof v === 'object' ? JSON.stringify(v) : v}</td></tr>`).join('')}
                    </table>
                    </div>
                </div>`;
            }

            const outs = data.agent_outputs;

            // 3. Explanation Text
            if (outs.explanation_text) {
                content.innerHTML += `<div class="result-block"><h3>Diagnosis & Explanation</h3><p style="white-space: pre-wrap;">${outs.explanation_text}</p></div>`;
            }

            // 4. Follow Up
            if (outs.followup_output) {
                content.innerHTML += `<div class="result-block"><h3>Referral & Follow Ups</h3><pre>${JSON.stringify(outs.followup_output, null, 2)}</pre></div>`;
            }

            // 5. Similar Cases
            if (outs.retrieved_cases && outs.retrieved_cases.length) {
                const casesHtml = outs.retrieved_cases.map(c => `
                    <div class="case-card">
                        <h4>Case ID: ${c.case_id || 'Unknown'} (Score: ${c.score})</h4>
                        <p>${c.summary || 'No summary'}</p>
                    </div>
                 `).join('');
                content.innerHTML += `<div class="result-block"><h3>Similar Cases Found</h3>${casesHtml}</div>`;
            }

            document.getElementById('resultsSection').style.display = "block";
        }

        // Chat Logic
        const chatHistory = document.getElementById('chatHistory');
        const chatInput = document.getElementById('chatInput');

        function addChatMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
            div.innerText = text;
            chatHistory.appendChild(div);
            // Scroll logic
            setTimeout(() => chatHistory.scrollTop = chatHistory.scrollHeight, 10);
        }

        async function sendChat() {
            const text = chatInput.value.trim();
            if (!text || !currentInteractionId) return;

            addChatMessage(text, true);
            chatInput.value = "";

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        interaction_id: currentInteractionId,
                        message: text
                    })
                });

                const data = await res.json();
                if (data.reply) {
                    addChatMessage(data.reply, false);
                } else {
                    addChatMessage("Sorry, I couldn't understand that.", false);
                }
            } catch (err) {
                addChatMessage("Error getting response: " + err.message, false);
            }
        }

        chatInput.onkeypress = function (e) {
            if (e.key === 'Enter') sendChat();
        };
    </script>
</body>

</html>
